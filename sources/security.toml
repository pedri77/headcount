# ── EU and Spain: network security, operational resilience ──────────────────
#
# One finding worth carrying: as of November 2026 Spain has not transposed NIS2. The draft bill was
# approved in January 2025 and lapsed when Parliament was dissolved in October 2026. What binds an
# entity under Spanish law today is the NIS1 regime (Royal Decree-law 12/2018 and Royal Decree
# 43/2021), plus the ENS for the public sector and its suppliers. Citing NIS2 as Spanish law is wrong.

[[source]]
id = "eu-nis2-directive"
title = "Directive (EU) 2022/2555 — NIS2"
publisher = "Publications Office of the European Union"
url = "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
license = "attribution-required"
jurisdiction = "EU"
authoritative_for = "Which sectors and entities are essential or important, the risk-management measures of Article 21, and the 24-hour, 72-hour and one-month reporting stages of Article 23. A directive binds member states: an entity is bound by its national transposition, not by this text directly."
skills = ["security:chief-information-security-officer", "security:incident-response", "legal-risk:regulatory-compliance"]
checked = "2026-11-02"

[[source]]
id = "eu-nis2-implementing-regulation-2024-2690"
title = "Commission Implementing Regulation (EU) 2024/2690 — NIS2 technical requirements for digital providers"
publisher = "Publications Office of the European Union"
url = "https://eur-lex.europa.eu/eli/reg_impl/2024/2690/oj"
license = "attribution-required"
jurisdiction = "EU"
authoritative_for = "The concrete technical and methodological requirements for cloud, data center, managed service and managed security service providers under NIS2, and when their incidents count as significant. A regulation needs no transposition, but it reaches only entities inside NIS2's scope, and for cloud providers that turns on size: medium-sized providers are in, small and micro ones generally are not."
skills = ["security:chief-information-security-officer", "legal-risk:regulatory-compliance"]
checked = "2026-11-02"

[[source]]
id = "enisa-nis2-technical-guidance"
