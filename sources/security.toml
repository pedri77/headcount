url = "https://www.enisa.europa.eu/publications/nis2-technical-implementation-guidance"
license = "free-to-read"
jurisdiction = "EU"
authoritative_for = "How to evidence each requirement of Implementing Regulation 2024/2690, with example evidence and mappings to common standards. Guidance, not law: it settles how to show compliance, not whether a requirement applies."
skills = ["security:chief-information-security-officer"]
checked = "2026-11-02"

[[source]]
